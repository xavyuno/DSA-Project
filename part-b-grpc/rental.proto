// B1 - Protocol Buffer contract for the rental service
// group credit note: this was already one of the strongest parts of the original repo.
// the property/user/booking messages and all 8 RPCs (including both streaming calls) were already defined.
// later edits were mostly cleanup so the server/client use the same contract, not a rewrite of the original work.
// exact original author isnt stored in the zip, so add their name here from github history before the final push.
syntax = "proto3";

enum PropertyStatus {
    AVAILABLE = 0;
    BOOKED = 1;
    STATUS_REMOVED = 2;
}

enum UserRole {
    HOST = 0;
    GUEST = 1;
}

message Property {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    string property_type = 5;
    double price_per_night = 6;
    PropertyStatus status = 7;
    string description = 8;
    repeated string amenities = 9;
}

message User {
    string user_id = 1;
    string name = 2;
    UserRole role = 3;
    string email = 4;
    string phone = 5;
}

message UserCreateInput {
    string user_id = 1;
    string name = 2;
    UserRole role = 3;
    string email = 4;
    string phone = 5;
}

message UserCreateOutput {
    int32 total_created = 1;
    string message = 2;
}

message AddPropertyInput {
    string host_id = 1;
    string name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
    string description = 6;
    repeated string amenities = 7;
}

message AddPropertyOutput {
    Property property = 1;
    string message = 2;
    bool success = 3;
}

message UpdatePropertyInput {
    string property_id = 1;
    double price_per_night = 2;
    PropertyStatus status = 3;
    string description = 4;
}

message RemovePropertyInput {
    string property_id = 1;
    string host_region = 2; // kept from the original group contract; server still derives the real region from stored data
}

message RemovePropertyOutput {
    repeated Property remaining_properties = 1;
    string message = 2;
}

message SearchInput {
    string property_id = 1;
}

message SearchPropertyOutput {
    Property property = 1;
    bool available = 2;
    string message = 3;
}

message SearchFilterInput {
    string location = 1;
    double min_price = 2;
    double max_price = 3;
    string property_type = 4;
}

message BookingRequest {
    string property_id = 1;
    string guest_id = 2;
    string check_in = 3;
    string check_out = 4;
}

message TempBookingOutput {
    string temp_id = 1;
    string message = 2;
    bool success = 3;
}

message ConfirmBookingRequest {
    string temp_id = 1;
}

message BookingConfirmationOutput {
    string booking_id = 1;
    string property_id = 2;
    string guest_id = 3;
    string check_in = 4;
    string check_out = 5;
    int32 nights = 6;
    double total_cost = 7;
    bool confirmed = 8;
    string message = 9;
}

service RentalService {
    rpc add_property(AddPropertyInput) returns (AddPropertyOutput);
    rpc create_users(stream UserCreateInput) returns (UserCreateOutput);
    rpc update_property(UpdatePropertyInput) returns (AddPropertyOutput);
    rpc remove_property(RemovePropertyInput) returns (RemovePropertyOutput);
    rpc list_available_properties(SearchFilterInput) returns (stream Property);
    rpc search_property(SearchInput) returns (SearchPropertyOutput);
    rpc book_property(BookingRequest) returns (TempBookingOutput);
    rpc confirm_booking(ConfirmBookingRequest) returns (BookingConfirmationOutput);
}
