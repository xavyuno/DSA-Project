<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Management</title>
    <script src="schedule.js" defer></script>
    <script src="loadAssets.js" defer></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1><a href="../index.html">Library Management System</a>/Schedule Management</h1>

    <form>
        <label for="addAssetTag">Asset Tag:</label>
        <select id="assetTag" name="assetTag" placeholder="Asset tag">
            <!-- Options will be populated here -->
        </select>

        <label for="scheduleID">Schedule ID:</label>
        <input type="text" id="scheduleID" name="scheduleID" placeholder="Schedule ID">
       
        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" name="dueDate">

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="Description">
        
        <button type="button" id="submit">Submit</button>
    </form>
</body>
</html>
