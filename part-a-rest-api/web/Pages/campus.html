<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus View</title>
    <script src="campus.js" defer></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <h1><a href="../index.html">Library Management System</a>/Campus View</h1>
    <form>
        <label for="campusCode">Campus Code:</label>
        <input type="text" id="campusCode" name="campusCode" placeholder="Short code for the campus">
       
        <label for="site">Site:</label>
        <input type="text" id="site" name="site" placeholder="Site name (optional)">
       
        <table>
        <thead>
            <tr>
                <th>Asset Tag</th>
                <th>Asset Name</th>
                <th>Institution</th>
                 <th>Site</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="globalTable">
            <!-- Data will be populated here -->
        </tbody>
    </table>
    <button type="button" id="submit">Submit</button>
    </form>
    
</body>
</html>
