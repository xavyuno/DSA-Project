syntax = "proto3";

package rental;


//List of Options (Enumerations)


enum PropertyStatus {
	AVAILABLE = 0;
	BOOKED = 1;
	STATUS_REMOVED = 2;
}

enum UserRole {
	HOST = 0;
	GUEST = 1;
}

//MAIN MODELS

message Property {
	string property_id = 1;
	string host_id = 2;
	string name = 3;
	string location = 4;
	string property_type = 5;
	double price_per_night = 6;
	PropertyStatus status = 7;
	string description = 8;
	repeated string amenities = 9;
}

message User {
	string user_id = 1;
	string name = 2;
	UserRole role = 3;
	string email = 4;
	string phone = 5;
}


// PROPERTY MESSAGES

//Create a new Property

message AddPropertyInput {
	string host_id = 1;
	string name = 2;
	string location = 3;
	string property_type = 4;
	double price_per_night = 5;
	string description = 6;
	repeated string amenities = 7;
}

message AddPropertyOutput {
	Property property = 1;
	string message = 2;
	bool success = 3;
}


//Updating Existing Property

message UpdatePropertyInput {
	string property_id = 1;
	double price_per_night = 2;
	PropertyStatus status = 3;
	string description = 4;
}

//Delete/Remove Property

message RemovePropertyInput {
	string property_id = 1;
	string host_region = 2;
}


message RemovePropertyOutput {
	repeated Property remaining_properties = 1;
	string message = 2;
}



//Search & Filter 

message SearchInput {
	string property_id = 1;
}

message SearchPropertyOutput {
	Property property = 1;
	bool available = 2;
	string message = 3;
}

message SearchFilterInput {
	string location = 1;
	double min_price = 2;
	double max_price = 3;
	string property_type = 4;
}


//User Creation

message UserCreateInput {
	string user_id = 1;
	string name = 2;
	UserRole role = 3;
	string email = 4;
	string phone = 5;
}


//Multiple User creation response

message UserCreateOutput {
	int32 total_created = 1;
	string message = 2;
}


//Booking Messages

message BookingRequest {
	string property_id = 1;
	string guest_id = 2;
	string check_in = 3;
	string check_out = 4;
}

//Temporary Booking Validation

message TempBookingOutput {
	string temp_id = 1;
	string message = 2;
	bool success = 3;
}

//Temporary Booking confirmation

message ConfirmBookingRequest {
	string temp_id = 1;
}


//Booking Confirmation details 

message BookingConfirmationOutput {
	string booking_id = 1;
	string property_id = 2;
	string guest_id = 3;
	string check_in = 4;
	string check_out = 5;
	int32 nights = 6;
	double total_cost = 7;
	bool confirmed = 8;
	string message = 9;
}


//Rental Service Definitions

service RentalService {
	//Property Opertions
	rpc add_property(AddPropertyInput) returns (AddPropertyOutput);
	rpc update_property(UpdatePropertyInput) returns (AddPropertyOutput);
	rpc remove_property(RemovePropertyInput) returns (RemovePropertyOutput);
	rpc search_property(SearchInput) returns (SearchPropertyOutput);
	rpc list_available_properties(SearchFilterInput) returns (stream Property);

	//User Operations
	rpc create_users(stream UserCreateInput) returns (UserCreateOutput);

	//Booking Operations
	rpc book_property(BookingRequest) returns (TempBookingOutput);
	rpc confirm_booking(ConfirmBookingRequest) returns (BookingConfirmationOutput);
}

